<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="auth_guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared_styles.css">
    <script src="mobile_fixes.js"></script>
    <title>Game - Brushing Master</title>
    <style>
        /* 游戏画布层 - 全屏背景，使用动态视口高度 */
        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--app-height, 100vh);
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* 头套渲染层 - 位于森林层之上 */
        #avatar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--app-height, 100vh);
            object-fit: cover;
            z-index: 3;
            pointer-events: none;
        }

        /* 加载遮罩 - Kawaii 风格，使用动态视口高度 */
        #loading-overlay {
            position: fixed;
            inset: 0;
            min-height: var(--app-height, 100vh);
            background-color: var(--bg-light);
            background-image: radial-gradient(rgba(0, 104, 55, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.5s ease-out;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 加载卡片容器 */
        .loading-card {
            background: white;
            border: 4px solid var(--stroke-dark);
            border-radius: 32px;
            box-shadow: 8px 8px 0 rgba(44, 62, 80, 0.15);
            padding: 40px 48px;
            text-align: center;
            width: 280px; /* 固定宽度，防止文字变化时卡片大小跳动 */
        }

        /* 吉祥物动画 */
        .loading-mascot {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            animation: mascotBounce 1.2s ease-in-out infinite;
        }

        @keyframes mascotBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* 加载点动画 */
        .loading-dots {
            display: inline-flex;
            gap: 6px;
            margin-left: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--primary-green);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 权限提示，使用动态视口高度 */
        #permission-overlay {
            position: fixed;
            inset: 0;
            min-height: var(--app-height, 100vh);
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2100;
            padding: 24px;
        }

        #permission-overlay.show {
            display: flex;
        }

        /* 状态提示条 */
        #status-bar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #status-bar.show {
            opacity: 1;
        }

        /* 得分动画 */
        .score-popup {
            position: fixed;
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 150;
            animation: scoreFloat 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes scoreFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        .bacteria {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* 正反馈动画 - 首次成功庆祝 */
        .celebration-effect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: var(--accent-yellow);
            animation: celebrationPop 1.5s ease-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes celebrationPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        /* 正反馈动画 - 连击效果 */
        .combo-effect {
            position: fixed;
            top: 30%;
            right: 20px;
            font-size: 48px;
            font-weight: 900;
            color: var(--combo-color, #FFD700);
            text-shadow: 4px 4px 0 #333;
            animation: comboSlide 1s ease-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes comboSlide {
            0% {
                transform: translateX(50px) scale(0.5);
                opacity: 0;
            }

            20% {
                transform: translateX(0) scale(1.2);
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateX(-50px);
                opacity: 0;
            }
        }

        /* ===== 视觉层样式 ===== */
        .visual-layer {
            position: fixed;
            left: 0;
            width: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        .visual-layer.active {
            opacity: 1;
        }

        .visual-layer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 森林边框层 - 顶部 */
        .forest-border {
            top: -6%;
            z-index: 2;
        }

        /* 下排牙齿层 - 底部 */
        .teeth-layer {
            bottom: -8%;
            z-index: 4;
            position: fixed;
        }

        /* 菌斑容器 - 定位到牙冠区域，贴合牙齿图层 */
        .plaque-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 23%;
            height: 22%;
            pointer-events: none;
            z-index: 5; /* 确保在牙齿层之上 */
        }

        .plaque-item {
            position: absolute;
            bottom: 0;
            width: var(--plaque-width, clamp(120px, 34vw, 240px));
            transform: translateX(-50%) translateY(var(--plaque-offset-y, 0px));
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }

        .plaque-item img {
            width: 100%;
            height: auto;
            display: block;
            transform-origin: center bottom;
        }

        .plaque-item[data-plaque-id="1"] {
            left: 15%;
            --plaque-width: clamp(145px, 39vw, 270px);
            --plaque-offset-y: -56px;
        }

        .plaque-item[data-plaque-id="2"] {
            left: 50%;
            --plaque-width: clamp(135px, 35vw, 235px);
            --plaque-offset-y: -16px;
        }

        .plaque-item[data-plaque-id="3"] {
            left: 85%;
            --plaque-width: clamp(145px, 39vw, 270px);
            --plaque-offset-y: -6px;
        }

        /* 菌斑消除动画 */
        @keyframes plagueDissolve {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            30% {
                opacity: 0.8;
                transform: scale(1.15) translateY(-5px);
            }
            100% {
                opacity: 0;
                transform: scale(0.3) translateY(-30px);
            }
        }

        .plaque-item.dissolving img {
            animation: plagueDissolve 0.7s ease-out forwards;
        }

        /* 菌斑消除粒子效果 */
        .plaque-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #9333EA;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            animation: particleBurst 0.6s ease-out forwards;
        }

        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: scale(0.4) translate(var(--tx, 0), var(--ty, 0));
            }
        }

        /* 菌斑消除闪光效果 */
        .plaque-flash {
            position: fixed;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: flashPop 0.4s ease-out forwards;
        }

        @keyframes flashPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        /* ===== 攻击菌斑动效 ===== */
        /* 能量弹 - 从随机位置飞向菌斑 */
        .attack-projectile {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1001;
            background: radial-gradient(circle at 30% 30%, #FFFACD, #FFE066, #FFD700, #FFA500);
            box-shadow:
                0 0 15px #FFD700,
                0 0 30px rgba(255, 215, 0, 0.8),
                0 0 50px rgba(255, 165, 0, 0.6),
                0 0 70px rgba(255, 140, 0, 0.4);
            animation: projectileFly var(--fly-duration, 0.5s) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        /* 能量弹内核 */
        .attack-projectile::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #FFFFFF 0%, #FFFACD 50%, transparent 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: coreGlow 0.15s ease-in-out infinite alternate;
        }

        /* 能量弹拖尾 */
        .attack-projectile::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 24px;
            background: linear-gradient(to right,
                rgba(255, 215, 0, 0.9) 0%,
                rgba(255, 165, 0, 0.6) 30%,
                rgba(255, 140, 0, 0.3) 60%,
                transparent 100%);
            border-radius: 0 50% 50% 0;
            transform-origin: 0% 50%;
            transform: translate(0, -50%) rotate(var(--trail-angle, 0deg));
            filter: blur(4px);
        }

        @keyframes coreGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes projectileFly {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
                filter: blur(5px);
            }
            15% {
                transform: translate(calc(-50% + var(--dx) * 0.05), calc(-50% + var(--dy) * 0.05)) scale(1.3);
                opacity: 1;
                filter: blur(0);
            }
            85% {
                transform: translate(calc(-50% + var(--dx) * 0.9), calc(-50% + var(--dy) * 0.9)) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.8);
                opacity: 0.9;
            }
        }

        /* 冲击波 - 能量弹击中时产生（加强版） */
        .attack-impact {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            border: 5px solid rgba(255, 215, 0, 0.9);
            background: radial-gradient(circle,
                rgba(255, 255, 255, 0.8) 0%,
                rgba(255, 215, 0, 0.5) 30%,
                rgba(255, 165, 0, 0.3) 60%,
                transparent 100%);
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 165, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.5);
            animation: impactWave 0.6s ease-out forwards;
        }

        /* 第二层冲击波 */
        .attack-impact-secondary {
            position: fixed;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            border: 3px solid rgba(255, 255, 255, 0.7);
            background: transparent;
            animation: impactWaveSecondary 0.5s ease-out 0.1s forwards;
        }

        @keyframes impactWave {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }
        }

        @keyframes impactWaveSecondary {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
            }
        }

        /* 菌斑受击抖动效果（加强版） */
        .plaque-item.hit img {
            animation: plagueHit 0.5s ease-out;
        }

        @keyframes plagueHit {
            0% {
                transform: scale(1) rotate(0);
                filter: brightness(1) saturate(1);
            }
            10% {
                transform: scale(0.85) rotate(-8deg);
                filter: brightness(2) saturate(1.5);
            }
            25% {
                transform: scale(1.15) rotate(6deg);
                filter: brightness(1.8) saturate(1.3);
            }
            40% {
                transform: scale(0.9) rotate(-5deg);
                filter: brightness(1.5) saturate(1.2);
            }
            55% {
                transform: scale(1.1) rotate(4deg);
                filter: brightness(1.3) saturate(1.1);
            }
            70% {
                transform: scale(0.95) rotate(-2deg);
                filter: brightness(1.15) saturate(1.05);
            }
            85% {
                transform: scale(1.03) rotate(1deg);
                filter: brightness(1.05) saturate(1);
            }
            100% {
                transform: scale(1) rotate(0);
                filter: brightness(1) saturate(1);
            }
        }

        /* 击中闪光效果 */
        .hit-flash {
            position: fixed;
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 998;
            background: radial-gradient(circle,
                rgba(255, 255, 255, 0.9) 0%,
                rgba(255, 215, 0, 0.4) 40%,
                transparent 70%);
            animation: hitFlash 0.3s ease-out forwards;
        }

        @keyframes hitFlash {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        /* 能量粒子散射 */
        .energy-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            background: #FFD700;
            box-shadow: 0 0 10px #FFD700, 0 0 20px rgba(255, 215, 0, 0.5);
            animation: energyParticleFly 0.5s ease-out forwards;
        }

        @keyframes energyParticleFly {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="app-shell relative overflow-hidden safe-area-top">

    <!-- 游戏画布（摄像头 + 头套渲染） -->
    <canvas id="game-canvas" class="game-canvas-layer"></canvas>
    <canvas id="avatar-canvas" class="avatar-canvas-layer"></canvas>

    <!-- ===== 视觉装饰层（仅游戏进行时显示） ===== -->
    <!-- 森林边框层（顶部） -->
    <div id="forest-border-layer" class="visual-layer forest-border">
        <img src="game-assets/forest-border.png" alt="" />
    </div>

    <!-- 下排牙齿层（底部） -->
    <div id="teeth-layer" class="visual-layer teeth-layer">
        <img src="game-assets/lower-teeth.png" alt="" />
        <!-- 菌斑覆盖在牙齿上 -->
        <div id="plaque-layer" class="plaque-container">
            <div class="plaque-item" data-plaque-id="1">
                <img src="game-assets/plaque-1.png" alt="" />
            </div>
            <div class="plaque-item" data-plaque-id="2">
                <img src="game-assets/plaque-2.png" alt="" />
            </div>
            <div class="plaque-item" data-plaque-id="3">
                <img src="game-assets/plaque-3.png" alt="" />
            </div>
        </div>
    </div>

    <!-- 加载遮罩 - Kawaii 风格 -->
    <div id="loading-overlay">
        <div class="loading-card">
            <!-- 吉祥物 -->
            <div class="loading-mascot">
                <img src="./owl_mascot.svg" alt="猫头鹰吉祥物" class="w-full h-full object-contain" style="filter: drop-shadow(4px 4px 0 rgba(44, 62, 80, 0.2));" />
            </div>

            <!-- 状态文字 -->
            <div class="text-lg font-black text-[var(--stroke-dark)] mb-1">
                <span id="loading-label">准备中</span>
                <span class="loading-dots" id="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>
            <div class="text-sm font-bold text-gray-400" id="loading-detail">正在启动摄像头</div>
        </div>
    </div>

    <!-- 权限提示 -->
    <div id="permission-overlay">
        <div class="text-center">
            <div class="text-6xl mb-6">📷</div>
            <h2 class="text-white text-2xl font-bold mb-4">需要摄像头权限</h2>
            <p class="text-gray-300 mb-6">为了识别您的刷牙动作，我们需要使用摄像头。</p>
            <button id="retry-permission" class="kawaii-button kawaii-button-primary px-8 py-3 text-lg">
                授权摄像头
            </button>
            <button onclick="location.href='home.html'"
                class="kawaii-button kawaii-button-red px-8 py-3 text-lg mt-4 block w-full">
                返回主页
            </button>
        </div>
    </div>

    <!-- UI Overlays - 使用动态 safe-area -->
    <div class="absolute inset-x-0 px-3 flex justify-between items-start pointer-events-none z-10" style="top: calc(var(--app-safe-top, 0px) + 12px);">
        <div id="pause-btn"
            class="kawaii-button kawaii-button-red w-12 h-12 rounded-full flex items-center justify-center pointer-events-auto">
            <i class="fas fa-pause"></i>
        </div>
    </div>

    <!-- 积分显示已移除 - 简化得分体系 -->

    <!-- 状态提示条 -->
    <div id="status-bar">请露出牙齿</div>

    <!-- Bacteria Targets (装饰) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-5">
        <div class="grid grid-cols-2 gap-20 opacity-30">
            <div class="bacteria text-green-400 text-6xl drop-shadow-[0_4px_0_#333]">
                <i class="fas fa-virus"></i>
            </div>
            <div class="bacteria text-purple-400 text-7xl drop-shadow-[0_4px_0_#333]" style="animation-delay: 0.5s">
                <i class="fas fa-biohazard"></i>
            </div>
            <div class="bacteria text-yellow-400 text-5xl drop-shadow-[0_4px_0_#333]" style="animation-delay: 0.2s">
                <i class="fas fa-bacteria"></i>
            </div>
            <div class="bacteria text-green-300 text-6xl drop-shadow-[0_4px_0_#333]" style="animation-delay: 0.8s">
                <i class="fas fa-virus-slash"></i>
            </div>
        </div>
    </div>

    <!-- 暂停/退出确认弹框 - 使用动态视口高度限制 -->
    <div id="pause-modal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[2200] p-6">
        <div class="bg-white rounded-[32px] border-4 border-[#333] w-full max-w-sm shadow-[8px_8px_0_#333] overflow-hidden transform transition-all duration-300 scale-95 opacity-0"
            id="pause-modal-content" style="max-height: calc(var(--app-height, 100vh) - 40px);">
            <div class="p-8">
                <!-- 暂停图标 -->
                <div class="text-center mb-6">
                    <div
                        class="w-20 h-20 mx-auto bg-yellow-100 rounded-full border-4 border-[#333] flex items-center justify-center shadow-[4px_4px_0_#333]">
                        <i class="fas fa-pause text-yellow-500 text-3xl"></i>
                    </div>
                </div>

                <!-- 提示文字 -->
                <h2 class="text-2xl font-black text-center mb-3 text-[var(--stroke-dark)]">确认不刷了吗？</h2>
                <p class="text-center text-gray-500 text-base mb-8 leading-relaxed">退出后本次刷牙进度将不会保存哦～</p>

                <!-- 按钮 -->
                <div class="flex flex-col gap-3">
                    <button class="kawaii-button kawaii-button-primary py-4 text-base font-black"
                        onclick="closePauseModal()">继续刷牙</button>
                    <button class="kawaii-button kawaii-button-red py-4 text-base font-black"
                        onclick="confirmExit()">确认退出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载 BrushGame 引擎 -->
    <script src="lib/embed/brushing-engine.umd.js?v=3"></script>

    <script>
        // ===== 游戏配置 =====
        const selectedDuration = parseInt(localStorage.getItem('selectedDuration')) || 2;
        const gameDurationMs = selectedDuration * 60 * 1000;

        // 读取皮肤配置
        function getSelectedSkin() {
            return sessionStorage.getItem('selectedSkin') ||
                localStorage.getItem('selectedSkin') ||
                'owl';
        }

        // ===== DOM 元素 =====
        const canvas = document.getElementById('game-canvas');
        const avatarCanvas = document.getElementById('avatar-canvas');
        const timerDisplay = document.getElementById('timer-display'); // 可选
        const progressBar = document.getElementById('progress-bar'); // 可选
        // scoreDisplay 已移除 - 简化得分体系
        const statusBar = document.getElementById('status-bar');
        const actionText = document.getElementById('action-text'); // 可选
        const actionHint = document.getElementById('action-hint'); // 可选
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingLabel = document.getElementById('loading-label');
        const loadingDetail = document.getElementById('loading-detail');
        const permissionOverlay = document.getElementById('permission-overlay');
        const exitBtn = document.getElementById('exit-btn');

        // ===== 游戏状态 =====
        let gameHandle = null;
        let germsKilled = 0;
        let timerIntervalId = null; // Track interval for cleanup
        let isGameStarting = false; // Re-entry protection flag

        // ===== 正反馈系统状态 =====
        let hasShownFirstSuccess = false;
        let consecutiveStreak = 0;
        let lastSuccessTime = 0;
        const STREAK_TIMEOUT = 5000; // 5秒窗口内算连击

        // ===== 正反馈系统函数 =====
        function handleBrushSuccess(stats) {
            const now = Date.now();

            // 首次得分鼓励
            if (stats.successCount === 1) {
                showFirstSuccessEncouragement();
            }

            // 连击检测
            if (now - lastSuccessTime < STREAK_TIMEOUT && lastSuccessTime > 0) {
                consecutiveStreak++;
                if (consecutiveStreak >= 2) {
                    showStreakEncouragement(consecutiveStreak);
                }
            } else {
                consecutiveStreak = 1;
            }
            lastSuccessTime = now;

            // 震动反馈（移动端）
            if ('vibrate' in navigator) {
                navigator.vibrate(50);
            }
        }

        function showFirstSuccessEncouragement() {
            if (hasShownFirstSuccess) return;
            hasShownFirstSuccess = true;
            showStatus('棒极了！继续保持！ ⭐', 2000);
            showCelebrationEffect();
        }

        function showStreakEncouragement(streak) {
            const messages = {
                2: '连击 x2！太厉害了！',
                3: '连击 x3！无人能挡！',
                4: '连击 x4！超级刷牙王！',
                5: '连击 x5！传说降临！'
            };
            const msg = messages[streak] || `连击 x${streak}！神级操作！`;
            showStatus(msg, 1500);
            showComboEffect(streak);
        }

        function showCelebrationEffect() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration-effect';
            celebration.innerHTML = '<i class="fas fa-star"></i>';
            document.body.appendChild(celebration);
            setTimeout(() => celebration.remove(), 1500);
        }

        function showComboEffect(streak) {
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#A855F7', '#F97316'];
            const colorIndex = Math.min(streak - 2, colors.length - 1);
            const effect = document.createElement('div');
            effect.className = 'combo-effect';
            effect.style.setProperty('--combo-color', colors[colorIndex]);
            effect.textContent = `x${streak}`;
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 1000);
        }

        function resetFeedbackState() {
            hasShownFirstSuccess = false;
            consecutiveStreak = 0;
            lastSuccessTime = 0;
        }

        // ===== 视觉层管理器 =====
        const VisualLayers = {
            forestBorder: null,
            teethLayer: null,
            plagueContainer: null,
            plaguesCleared: 0,
            totalPlagueCount: 3,
            initialized: false,
            // 根据游戏时长设置菌斑消除门槛
            // 1分钟: 累计20次消除一个, 2分钟: 累计30次, 3分钟: 累计50次
            successPerPlague: selectedDuration === 1 ? 20 : (selectedDuration === 2 ? 30 : 50),
            // 距离上次消除后的成功次数
            successSinceLastPlague: 0,
            lastSuccessCount: 0,

            init() {
                if (this.initialized) return;
                this.forestBorder = document.getElementById('forest-border-layer');
                this.teethLayer = document.getElementById('teeth-layer');
                this.plagueContainer = document.getElementById('plaque-layer');
                this.initialized = true;
            },

            // 游戏开始时显示所有视觉层
            showLayers() {
                this.init();
                this.forestBorder?.classList.add('active');
                this.teethLayer?.classList.add('active');
                // 注意：不在这里重置 plaguesCleared，避免状态切换时丢失进度
                // 重置逻辑移到 reset() 方法中，只在游戏真正重新开始时调用
            },

            // 游戏结束/暂停时隐藏视觉层
            hideLayers() {
                this.forestBorder?.classList.remove('active');
                this.teethLayer?.classList.remove('active');
            },

            // 根据连续刷牙次数清除菌斑
            clearPlague(successCount) {
                if (successCount <= this.lastSuccessCount) return;

                if (successCount === this.lastSuccessCount + 1) {
                    this.successSinceLastPlague++;
                } else {
                    // 异常跳变时，按新一轮累计处理
                    this.successSinceLastPlague = 1;
                }
                this.lastSuccessCount = successCount;

                // 累计次数达到门槛，消除一个菌斑
                if (this.successSinceLastPlague >= this.successPerPlague && this.plaguesCleared < this.totalPlagueCount) {
                    this.plaguesCleared++;
                    const plagueItem = document.querySelector(`.plaque-item[data-plaque-id="${this.plaguesCleared}"]`);
                    if (plagueItem) {
                        this.triggerPlagueDissolve(plagueItem);
                        console.log('[VisualLayers] 清除菌斑 #' + this.plaguesCleared + ' (累计次数: ' + this.successSinceLastPlague + ', 门槛: ' + this.successPerPlague + ')');
                    }
                    // 消除后重置累计计数，开始下一轮
                    this.successSinceLastPlague = 0;
                }
            },

            // 触发菌斑消除动画
            triggerPlagueDissolve(plagueItem) {
                // 创建闪光效果
                this.createFlashEffect(plagueItem);
                // 创建粒子效果
                this.createParticles(plagueItem);
                // 触发消除动画
                plagueItem.classList.add('dissolving');
                // 震动反馈（短促双击）
                if ('vibrate' in navigator) {
                    navigator.vibrate([40, 30, 60]);
                }
            },

            // 创建闪光效果
            createFlashEffect(plagueItem) {
                const rect = plagueItem.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const flash = document.createElement('div');
                flash.className = 'plaque-flash';
                flash.style.left = `${centerX}px`;
                flash.style.top = `${centerY}px`;
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 400);
            },

            // 创建粒子爆发效果
            createParticles(plagueItem) {
                const rect = plagueItem.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // 创建 10 个粒子
                for (let i = 0; i < 10; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'plaque-particle';
                    const angle = (i / 10) * Math.PI * 2;
                    const distance = 40 + Math.random() * 30;
                    particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                    particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                    particle.style.left = `${centerX}px`;
                    particle.style.top = `${centerY}px`;
                    // 随机粒子颜色（紫色调）
                    const colors = ['#9333EA', '#A855F7', '#7C3AED', '#6D28D9'];
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(particle);

                    setTimeout(() => particle.remove(), 600);
                }
            },

            // 获取当前目标菌斑（未被清除的第一个）
            getCurrentTargetPlague() {
                const nextTarget = this.plaguesCleared + 1;
                if (nextTarget <= this.totalPlagueCount) {
                    return document.querySelector(`.plaque-item[data-plaque-id="${nextTarget}"]`);
                }
                return null;
            },

            // 攻击菌斑动效 - 每次刷牙成功时调用
            triggerAttackEffect() {
                const targetPlague = this.getCurrentTargetPlague();
                if (!targetPlague) return;

                const targetRect = targetPlague.getBoundingClientRect();
                const targetX = targetRect.left + targetRect.width / 2;
                const targetY = targetRect.top + targetRect.height / 2;

                // 随机起点：从屏幕四周随机位置飞来
                const startPositions = this.getRandomStartPosition(targetX, targetY);
                const startX = startPositions.x;
                const startY = startPositions.y;

                // 计算飞行距离和角度
                const dx = targetX - startX;
                const dy = targetY - startY;
                const flyDuration = 0.45; // 飞行时间

                // 计算拖尾角度（与飞行方向相反）
                const trailAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 180;

                // 1. 创建能量弹
                const projectile = document.createElement('div');
                projectile.className = 'attack-projectile';
                projectile.style.left = `${startX}px`;
                projectile.style.top = `${startY}px`;
                projectile.style.setProperty('--dx', `${dx}px`);
                projectile.style.setProperty('--dy', `${dy}px`);
                projectile.style.setProperty('--fly-duration', `${flyDuration}s`);
                projectile.style.setProperty('--trail-angle', `${trailAngle}deg`);
                document.body.appendChild(projectile);

                // 2. 能量弹到达后触发冲击效果
                setTimeout(() => {
                    projectile.remove();

                    // 创建击中闪光
                    const flash = document.createElement('div');
                    flash.className = 'hit-flash';
                    flash.style.left = `${targetX}px`;
                    flash.style.top = `${targetY}px`;
                    document.body.appendChild(flash);
                    setTimeout(() => flash.remove(), 300);

                    // 创建主冲击波
                    const impact = document.createElement('div');
                    impact.className = 'attack-impact';
                    impact.style.left = `${targetX}px`;
                    impact.style.top = `${targetY}px`;
                    document.body.appendChild(impact);
                    setTimeout(() => impact.remove(), 600);

                    // 创建第二层冲击波
                    const impactSecondary = document.createElement('div');
                    impactSecondary.className = 'attack-impact-secondary';
                    impactSecondary.style.left = `${targetX}px`;
                    impactSecondary.style.top = `${targetY}px`;
                    document.body.appendChild(impactSecondary);
                    setTimeout(() => impactSecondary.remove(), 600);

                    // 创建能量粒子散射
                    this.createEnergyParticles(targetX, targetY);

                    // 菌斑受击抖动
                    targetPlague.classList.add('hit');
                    setTimeout(() => targetPlague.classList.remove('hit'), 500);

                    // 震动反馈（加强）
                    if ('vibrate' in navigator) {
                        navigator.vibrate([20, 10, 30]);
                    }
                }, flyDuration * 1000);
            },

            // 获取随机起点位置
            getRandomStartPosition(targetX, targetY) {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const margin = 50; // 边缘距离

                // 随机选择从哪个方向飞来：0=上, 1=右, 2=下, 3=左
                const direction = Math.floor(Math.random() * 4);
                let x, y;

                switch (direction) {
                    case 0: // 从上方
                        x = margin + Math.random() * (vw - margin * 2);
                        y = -margin;
                        break;
                    case 1: // 从右侧
                        x = vw + margin;
                        y = margin + Math.random() * (vh * 0.6); // 上半部分
                        break;
                    case 2: // 从左侧
                        x = -margin;
                        y = margin + Math.random() * (vh * 0.6); // 上半部分
                        break;
                    case 3: // 从屏幕中上部随机位置
                        x = vw * 0.2 + Math.random() * (vw * 0.6);
                        y = vh * 0.1 + Math.random() * (vh * 0.3);
                        break;
                }

                return { x, y };
            },

            // 创建能量粒子散射
            createEnergyParticles(x, y) {
                const particleCount = 8;
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'energy-particle';
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;

                    // 随机散射方向
                    const angle = (i / particleCount) * Math.PI * 2 + Math.random() * 0.5;
                    const distance = 40 + Math.random() * 60;
                    particle.style.setProperty('--px', `${Math.cos(angle) * distance}px`);
                    particle.style.setProperty('--py', `${Math.sin(angle) * distance}px`);

                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 500);
                }
            },

            // 重置状态（游戏重新开始时调用）
            reset() {
                this.plaguesCleared = 0;
                this.successSinceLastPlague = 0;
                this.lastSuccessCount = 0;
                // 重置所有菌斑为可见
                document.querySelectorAll('.plaque-item').forEach(item => {
                    item.classList.remove('dissolving');
                    item.style.opacity = '1';
                    item.style.transform = '';
                });
                this.hideLayers();
            }
        };

        // ===== UI 更新函数 =====
        function formatTime(ms) {
            const totalSeconds = Math.ceil(ms / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            if (!gameHandle) return;
            const remaining = gameHandle.getRemainingTime();
            // Clamp remaining to valid range to prevent progress bar overflow/underflow
            const clampedRemaining = Math.max(0, Math.min(remaining, gameDurationMs));

            // 只在元素存在时更新
            if (timerDisplay) {
                timerDisplay.textContent = formatTime(clampedRemaining);
            }

            if (progressBar) {
                const progress = (clampedRemaining / gameDurationMs) * 100;
                progressBar.style.width = `${Math.max(0, Math.min(100, progress))}%`;
            }
        }

        function showStatus(text, duration = 1500) {
            statusBar.textContent = text;
            statusBar.classList.add('show');
            setTimeout(() => {
                statusBar.classList.remove('show');
            }, duration);
        }

        // showScorePopup 已移除 - 简化得分体系

        function updateGameState(state) {
            // 如果动作提示元素不存在，直接返回（用户已移除这些 UI）
            if (!actionText && !actionHint) return;

            const stateMessages = {
                'init': { text: '准备开始', hint: '正在初始化...' },
                'ready': { text: '露出牙齿！', hint: '张大嘴巴露出牙齿' },
                'playing': { text: '开始刷牙！', hint: '握拳并上下或左右刷动' },
                'brushing': { text: '继续保持！', hint: '保持刷牙动作' },
                'success': { text: '太棒了！', hint: '继续加油！' },
                'gameover': { text: '游戏结束', hint: '正在计算结果...' }
            };

            const msg = stateMessages[state] || { text: state, hint: '' };
            if (actionText) {
                actionText.textContent = msg.text;
            }
            if (actionHint) {
                actionHint.textContent = msg.hint;
            }
        }

        // ===== 暂停/退出弹框 =====
        function showPauseModal() {
            const modal = document.getElementById('pause-modal');
            const content = document.getElementById('pause-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closePauseModal() {
            const modal = document.getElementById('pause-modal');
            const content = document.getElementById('pause-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function confirmExit() {
            if (gameHandle) {
                gameHandle.stop();
            }
            location.href = 'home.html';
        }

        const pauseBtn = document.getElementById('pause-btn');
        if (pauseBtn) {
            pauseBtn.onclick = showPauseModal;
        }

        // ===== 连续天数 =====
        function getStreakDays() {
            const streak = localStorage.getItem('streakDays');
            return streak ? parseInt(streak) : 1;
        }

        function updateStreak() {
            const lastBrushDate = localStorage.getItem('lastBrushDate');
            const today = new Date().toISOString().split('T')[0];

            if (lastBrushDate === today) {
                return getStreakDays();
            }

            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().split('T')[0];

            let streak = 1;
            if (lastBrushDate === yesterdayStr) {
                streak = getStreakDays() + 1;
            }

            localStorage.setItem('streakDays', streak.toString());
            localStorage.setItem('lastBrushDate', today);
            return streak;
        }

        // ===== 游戏结束处理 =====
        // capturedPhotos and remainingTime are passed in since gameHandle may be null after cleanup
        function handleGameOver(stats, capturedPhotos, remainingTime) {
            const streakDays = updateStreak();

            console.log('[Game] 抓拍照片数量:', capturedPhotos.length);

            // 准备游戏结果数据（不含照片，分开存储以减少配额压力）
            const gameResult = {
                duration: selectedDuration,
                germsKilled: stats.successCount * 3, // 每次成功算消灭3个细菌
                streakDays: streakDays,
                score: stats.score,
                successCount: stats.successCount,
                totalBrushTime: stats.totalBrushTime,
                accuracy: stats.accuracy,
                durationMs: gameDurationMs - remainingTime,
                photosAvailable: false // Will be updated if photos are saved successfully
            };

            // 尝试保存照片（带降级策略，避免 QuotaExceededError 阻断流程）
            let photosSaved = false;
            const photosToSave = compressPhotosForStorage(capturedPhotos, 6);

            if (photosToSave.length > 0) {
                // 策略1: 尝试保存全部 6 张
                const fullJson = JSON.stringify(photosToSave);
                photosSaved = safeStorageSet('capturedPhotos', fullJson);

                // 策略2: 失败则尝试只保存 3 张
                if (!photosSaved && photosToSave.length > 3) {
                    console.warn('[Storage] Retrying with fewer photos (3)');
                    const reducedPhotos = compressPhotosForStorage(photosToSave, 3);
                    photosSaved = safeStorageSet('capturedPhotos', JSON.stringify(reducedPhotos));
                }

                // 策略3: 再失败则只保存 1 张
                if (!photosSaved && photosToSave.length > 1) {
                    console.warn('[Storage] Retrying with single photo');
                    photosSaved = safeStorageSet('capturedPhotos', JSON.stringify([photosToSave[0]]));
                }

                // 策略4: 全部失败，清空照片存储，继续流程
                if (!photosSaved) {
                    console.warn('[Storage] All photo save attempts failed, continuing without photos');
                    try { sessionStorage.removeItem('capturedPhotos'); } catch (e) { /* ignore */ }
                }
            }

            // 更新游戏结果中的照片可用性标记
            gameResult.photosAvailable = photosSaved;

            // 保存游戏结果（不含大体积照片数据）
            const resultSaved = safeStorageSet('lastGameResult', JSON.stringify(gameResult));
            if (!resultSaved) {
                console.error('[Storage] Failed to save game result, but continuing to result page');
            }

            // 无论存储是否成功，都跳转到结果页（存储失败不阻断用户流程）
            setTimeout(() => {
                location.href = 'game_result.html';
            }, 1500);
        }

        // ===== Helper: Normalize error to string =====
        function getErrorMessage(err) {
            if (err instanceof Error) return err.message;
            if (typeof err === 'string') return err;
            if (err && typeof err.message === 'string') return err.message;
            return String(err);
        }

        // ===== Helper: Get error name safely =====
        function getErrorName(err) {
            if (err instanceof Error || err instanceof DOMException) return err.name || '';
            if (err && typeof err.name === 'string') return err.name;
            return '';
        }

        // ===== Helper: Check if error is permission denied (multi-signal) =====
        function isPermissionDenied(err) {
            // 1. Check error name (highest priority, works on iOS Safari even when message is empty)
            const name = getErrorName(err);
            const permissionErrorNames = [
                'NotAllowedError',      // Standard: user denied permission
                'SecurityError',        // Some browsers use this for permission issues
                'PermissionDeniedError' // Legacy/non-standard
            ];
            if (permissionErrorNames.includes(name)) {
                return true;
            }

            // 2. Check if it's a DOMException with permission-related code
            if (err instanceof DOMException) {
                // DOMException.SECURITY_ERR = 18, DOMException.NOT_ALLOWED_ERR doesn't have constant
                if (err.code === 18) return true;
            }

            // 3. Fallback: check message string (for browsers that don't set name correctly)
            const msg = getErrorMessage(err).toLowerCase();
            const permissionKeywords = [
                'permission', 'notallowed', 'not allowed', 'denied',
                'getusermedia', 'user denied', 'access denied'
            ];
            return permissionKeywords.some(kw => msg.includes(kw));
        }

        // ===== Helper: Safe sessionStorage write with fallback =====
        function safeStorageSet(key, value, fallbackValue = null) {
            try {
                sessionStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.warn('[Storage] Failed to save', key, ':', e.message || e);
                // Try with fallback value if provided
                if (fallbackValue !== null) {
                    try {
                        sessionStorage.setItem(key, fallbackValue);
                        return true;
                    } catch (e2) {
                        console.warn('[Storage] Fallback also failed:', e2.message || e2);
                    }
                }
                return false;
            }
        }

        // ===== Helper: Compress photos for storage =====
        // Reduces photo count and quality to fit within storage quota
        function compressPhotosForStorage(photos, maxCount = 6) {
            if (!photos || photos.length === 0) return [];

            // Strategy: keep up to maxCount photos, evenly distributed
            let selected = photos;
            if (photos.length > maxCount) {
                const step = photos.length / maxCount;
                selected = [];
                for (let i = 0; i < maxCount; i++) {
                    selected.push(photos[Math.floor(i * step)]);
                }
            }
            return selected;
        }

        // ===== Helper: Derive base paths relative to current page =====
        function getBasePaths() {
            // Get the directory of the current HTML file
            // e.g., https://example.com/app/prototype/game_play.html → https://example.com/app/prototype/
            const pageUrl = new URL('.', window.location.href).href;
            // basePath: current directory (for SkinSet images in same folder)
            const basePath = pageUrl.replace(/\/$/, '');
            // modelBasePath: go up one level from prototype to get to the root where /models/ is
            // e.g., https://example.com/app/prototype/ → https://example.com/app/
            const modelBasePath = new URL('..', pageUrl).href.replace(/\/$/, '');
            return { basePath, modelBasePath };
        }

        // ===== Cleanup previous game resources =====
        function cleanupGame() {
            if (timerIntervalId) {
                clearInterval(timerIntervalId);
                timerIntervalId = null;
            }
            if (gameHandle) {
                try {
                    gameHandle.stop();
                } catch (e) {
                    console.warn('[Game] Cleanup error:', e);
                }
                gameHandle = null;
            }
            // 重置视觉层
            VisualLayers.reset();
        }

        // ===== 启动游戏 =====
        async function startGame() {
            // Re-entry protection: prevent multiple concurrent starts
            if (isGameStarting) {
                console.log('[Game] Already starting, ignoring duplicate call');
                return;
            }

            // Cleanup any previous game instance
            cleanupGame();

            isGameStarting = true;
            const skinId = getSelectedSkin();
            const { basePath, modelBasePath } = getBasePaths();
            console.log('[Game] Paths - basePath:', basePath, 'modelBasePath:', modelBasePath);

            // 设置定时器更新
            timerIntervalId = setInterval(() => {
                updateTimer();
            }, 100);

            try {
                gameHandle = await BrushGame.start({
                    canvas: canvas,
                    avatarCanvas: avatarCanvas,
                    avatarId: skinId,
                    gameDurationMs: gameDurationMs,
                    basePath: basePath,        // 头套图片在 /prototype/SkinSet/
                    modelBasePath: modelBasePath, // 模型在 /models/
                    debug: false,

                    onProgress: (stage, progress) => {
                        const stageNames = {
                            'camera': '启动摄像头',
                            'models': '加载识别模型',
                            'avatar': '加载头套',
                            'ready': '准备就绪'
                        };
                        const stageDetails = {
                            'camera': '正在获取摄像头权限',
                            'models': '正在加载 AI 识别模型',
                            'avatar': '正在准备头套素材',
                            'ready': '即将开始游戏'
                        };
                        // 更新文字（只改 label 的 textContent，不影响 dots 动画）
                        const stageName = stageNames[stage] || stage;
                        loadingLabel.textContent = stageName;
                        loadingDetail.textContent = stageDetails[stage] || `进度: ${Math.round(progress * 100)}%`;
                    },

                    onState: (state, event) => {
                        console.log('[Game] State:', state, event);
                        updateGameState(state);

                        // 控制视觉层显示/隐藏
                        if (state === 'ready' || state === 'playing' || state === 'brushing' || state === 'success') {
                            VisualLayers.showLayers();
                        } else if (state === 'gameover' || state === 'init') {
                            VisualLayers.hideLayers();
                        }

                        if (state === 'ready') {
                            showStatus('请露出牙齿 😁');
                        } else if (state === 'playing') {
                            showStatus('开始刷牙！ 💪');
                        } else if (state === 'success') {
                            showStatus('太棒了！ ⭐');
                        }
                    },

                    onScore: (stats, points) => {
                        console.log('[Game] Score:', stats, '+', points);
                        // 简化得分体系：移除积分显示，只更新击败细菌数
                        germsKilled = stats.successCount * 3;
                        // 调用正反馈系统
                        handleBrushSuccess(stats);
                        // 触发攻击菌斑动效
                        VisualLayers.triggerAttackEffect();
                        // 触发菌斑清除检测
                        VisualLayers.clearPlague(stats.successCount);
                    },

                    onGameOver: (stats) => {
                        console.log('[Game] Game Over:', stats);
                        // Extract data BEFORE cleanup (since cleanup sets gameHandle to null)
                        const capturedPhotos = gameHandle ? gameHandle.getCapturedPhotos() : [];
                        const remainingTime = gameHandle ? gameHandle.getRemainingTime() : 0;
                        cleanupGame();
                        isGameStarting = false;
                        handleGameOver(stats, capturedPhotos, remainingTime);
                    },

                    onError: (err) => {
                        console.error('[Game] Error:', err);
                        cleanupGame();
                        isGameStarting = false;

                        if (isPermissionDenied(err)) {
                            permissionOverlay.classList.add('show');
                        } else {
                            alert('游戏出错: ' + getErrorMessage(err));
                            location.href = 'home.html';
                        }
                    }
                });

                // 隐藏加载遮罩
                loadingOverlay.classList.add('hidden');
                isGameStarting = false;
                updateTimer();

            } catch (err) {
                console.error('[Game] Failed to start:', err);
                cleanupGame();
                isGameStarting = false;

                if (isPermissionDenied(err)) {
                    loadingOverlay.classList.add('hidden');
                    permissionOverlay.classList.add('show');
                } else {
                    loadingLabel.textContent = '启动失败';
                    // 隐藏 dots 动画
                    const loadingDots = document.getElementById('loading-dots');
                    if (loadingDots) {
                        loadingDots.style.display = 'none';
                    }
                    loadingDetail.textContent = getErrorMessage(err);
                }
            }
        }

        // ===== 权限重试 =====
        document.getElementById('retry-permission').onclick = async () => {
            permissionOverlay.classList.remove('show');
            loadingOverlay.classList.remove('hidden');
            startGame();
        };

        // ===== 页面加载时启动游戏 =====
        // 需要用户手势才能启动摄像头（iOS 要求）
        // 如果是从其他页面点击进入的，已经有手势上下文
        document.addEventListener('DOMContentLoaded', () => {
            // 立即显示初始时间（如果元素存在）
            if (timerDisplay) {
                timerDisplay.textContent = formatTime(gameDurationMs);
            }

            // 稍微延迟启动，确保页面完全加载
            setTimeout(startGame, 100);
        });
    </script>

</body>
